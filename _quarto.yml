project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - projects/**/*.qmd
    - projects/**/*.md
    - projects/**/*.Rmd
    - "!**/*_old.*"
    - "!**/*_old/**"
    - "!**/README.*"
  resources:
    - assets/**
    - projects/**

website:
  title: "Ahmed Albarqi"
  description: "Policy research, econometrics, causal inference, and data visualization."
  navbar:
    pinned: true
    left:
      - href: index.qmd#research
        text: Research
      - href: index.qmd#visualizations
        text: Visualizations
      - href: index.qmd#contact
        text: Contact
    right:
      - icon: github
        href: https://github.com/asbarqi
        aria-label: GitHub
        target: _blank
      - icon: linkedin
        href: https://www.linkedin.com/in/asbarqi/
        aria-label: LinkedIn
        target: _blank
      - text: CV
        href: assets/files/Ahmed_Albarqi_CV.pdf
        target: _blank

format:
  html:
    theme: litera
    toc: false
    page-layout: full
    smooth-scroll: true
    anchor-sections: false
    css: assets/css/styles.css
